<text font-family="Georgia, serif" font-size="28" fill="#8b93a3">
<tspan x="120" y="394">Adding a 26B MoE beside a 40B one on 48 GB of unified</tspan>
<tspan x="120" y="432">memory — and the measurement that refused to admit it was</tspan>
<tspan x="120" y="470">faster.</tspan>
</text>
<text x="120" y="548" font-family="Menlo, monospace" font-size="23" letter-spacing="3" fill="#8b93a3">GPU RESIDENT, EACH ALONE</text>
