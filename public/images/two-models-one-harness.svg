<text x="140" y="1020" font-family="Menlo, monospace" font-size="17" fill="#8b93a3">every request returns HTTP 500</text>
<text x="1030" y="548" font-family="Menlo, monospace" font-size="23" letter-spacing="3" fill="#8b93a3">DECODE, SAME 4 PROMPTS</text>
<text x="1030" y="626" font-family="Georgia, serif" font-weight="bold" font-size="58" fill="#5aa3d6">56.4</text>
<text x="1202" y="626" font-family="Menlo, monospace" font-size="21" fill="#e8e4da">tok/s</text>
